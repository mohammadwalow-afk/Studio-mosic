<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15121f">
<title>استوديو الأغاني</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout concept: a four-step tape recorder. Setup, brief, lyrics and style, then the take (audio player). */
:root {
  --bg: #15121f; --surface: #1f1a2f; --surface2: #2a2340; --line: #3a3153;
  --fg: #f1ecfa; --muted: #a79fbd; --accent: #f2b84b; --accent-ink: #1b1305; --danger: #ff9a9a;
  --font-display: "Reem Kufi", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f7f4fb; --surface: #ffffff; --surface2: #efe9f8; --line: #d9cfea;
    --fg: #1d1930; --muted: #6a6282; --accent: #b8740a; --accent-ink: #ffffff; --danger: #b3261e;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.7;
  padding-block: max(20px, env(safe-area-inset-top, 0px)) max(48px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#app { max-width: 720px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; line-height: 1.3; text-wrap: balance; }
h1 { font-size: 2rem; } h2 { font-size: 1.15rem; }
p { margin: 0; }
.sub { color: var(--muted); font-size: .95rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.label { font-size: .85rem; color: var(--muted); font-weight: 500; }
textarea, select, input[type="text"], input[type="password"] {
  width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; font: inherit; min-width: 0;
}
textarea { min-height: 92px; resize: vertical; }
textarea.lyrics { min-height: 260px; }
.ltr { direction: ltr; text-align: left; font-family: var(--font-mono); font-size: .88rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: .92rem; background: var(--surface2); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 480px) { .row { grid-template-columns: 1fr; } }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { font: inherit; font-weight: 600; border-radius: 10px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--line); background: var(--surface2); color: var(--fg); text-decoration: none; display: inline-block; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 4px 12px; font-size: .85rem; font-weight: 500; }
.btn:disabled { opacity: .55; cursor: default; }
.status { color: var(--muted); font-size: .92rem; min-height: 1.4em; }
.status.err { color: var(--danger); }
.note { font-size: .9rem; border-inline-start: 3px solid var(--accent); padding: 2px 12px; color: var(--muted); }
details.card > summary { cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; }
details.card[open] > summary { margin-bottom: 14px; }
audio { width: 100%; }
.take { display: flex; flex-direction: column; gap: 12px; }
.lib-item { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.lib-item b { font-family: var(--font-display); font-size: 1.05rem; }
.meter { font-family: var(--font-mono); color: var(--accent); font-size: 1.1rem; }
@media (prefers-reduced-motion: no-preference) { .chip, .btn { transition: background .15s, border-color .15s; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>استوديو الأغاني</h1>
    <p class="sub">اكتب فكرة، فتُكتب الكلمات ثم تُغنّى بصوت وموسيقى كاملة.</p>
  </header>

  <details class="card" id="setup">
    <summary>١. الإعدادات</summary>
    <div class="field">
      <label class="label" for="key">مفتاح Gemini API</label>
      <input type="password" id="key" class="ltr" autocomplete="off" placeholder="AIza...">
      <p class="sub">يُحفظ في متصفحك على هذا الجهاز فقط، ويُرسل إلى Google وحدها.</p>
    </div>
    <div class="row">
      <div class="field">
        <label class="label" for="singModel">نموذج الغناء</label>
        <select id="singModel">
          <option value="lyria-3.5">Lyria 3.5: أغنية كاملة</option>
          <option value="lyria-3-clip-preview">Lyria 3 Clip: ٣٠ ثانية للتجربة</option>
        </select>
      </div>
      <div class="field">
        <label class="label" for="textModel">نموذج كتابة الكلمات</label>
        <input type="text" id="textModel" class="ltr" value="gemini-2.5-flash">
      </div>
    </div>
    <div class="actions"><button class="btn primary" id="saveKey" type="button">حفظ الإعدادات</button><span class="status" id="setupStatus"></span></div>
  </details>

  <section class="card" aria-label="الفكرة">
    <h2>٢. الفكرة</h2>
    <div class="field">
      <label class="label" for="idea">عن ماذا تريد الأغنية؟</label>
      <textarea id="idea">أغنية عن الحنين إلى مدينة قديمة في ليلة مطر، وعن صديق بعيد لا يزال يتذكرني.</textarea>
    </div>
    <div class="field"><span class="label">اللغة</span><div class="chips" id="g-lang"></div></div>
    <div class="field" id="dialect-field"><label class="label" for="dialect">اللهجة</label><select id="dialect"></select></div>
    <div class="field"><span class="label">الأسلوب</span><div class="chips" id="g-genre"></div></div>
    <div class="field"><span class="label">المزاج</span><div class="chips" id="g-mood"></div></div>
    <div class="row">
      <div class="field"><label class="label" for="maqam">المقام</label><select id="maqam"></select></div>
      <div class="field"><label class="label" for="voice">الصوت</label><select id="voice"></select></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="write" type="button">اكتب الكلمات</button>
      <span class="status" id="writeStatus" role="status"></span>
    </div>
  </section>

  <section class="card" id="lyricsCard" hidden>
    <h2>٣. الكلمات والأسلوب</h2>
    <p class="sub">عدّل ما تشاء قبل الغناء. الوسوم بين الأقواس مثل [Verse 1] تحدد أقسام الأغنية.</p>
    <div class="field"><label class="label" for="title">العنوان</label><input type="text" id="title"></div>
    <div class="field"><label class="label" for="lyrics">الكلمات</label><textarea id="lyrics" class="lyrics" dir="auto"></textarea></div>
    <div class="field"><label class="label" for="style">وصف الموسيقى (بالإنجليزية)</label><textarea id="style" class="ltr"></textarea></div>
    <p class="note" id="songNote" hidden></p>
    <div class="actions">
      <button class="btn primary" id="sing" type="button">غنِّ الأغنية</button>
      <button class="btn" id="stop" type="button" hidden>إيقاف</button>
      <span class="status" id="singStatus" role="status"></span>
    </div>
    <div class="take" id="take"></div>
  </section>

  <section class="card" id="libCard" hidden>
    <h2>أغانيك المحفوظة</h2>
    <div id="lib" style="display:flex;flex-direction:column;gap:10px"></div>
  </section>
</div>

<script>
(function () {
  "use strict";
  var API = "https://generativelanguage.googleapis.com/v1beta";
  var LANGS = [
    { id: "ar", label: "عربي", name: "Arabic", prompt: "Arabic (Arabic script)" },
    { id: "en", label: "English", name: "English", prompt: "English" },
    { id: "ckb", label: "كردي سوراني", name: "Central Kurdish (Sorani)", prompt: "Central Kurdish (Sorani), written in the Kurdish Arabic-script alphabet" },
    { id: "kmr", label: "كردي كرمانجي", name: "Northern Kurdish (Kurmanji)", prompt: "Northern Kurdish (Kurmanji), written in the Latin Kurdish alphabet" }
  ];
  var DIALECTS = ["فصحى مبسطة", "عراقي", "خليجي", "شامي", "مصري", "مغربي"];
  var GENRES = ["بوب", "طرب كلاسيكي", "راب", "هادئ", "شعبي ودبكة", "روك", "إلكتروني"];
  var MOODS = ["حنين", "فرح", "حماسة", "رومانسي", "حزين", "وطني"];
  var MAQAMS = ["اختر لي", "حجاز", "راست", "بيات", "صبا", "نهاوند", "كرد", "عجم", "سيكا", "ماجور", "مينور"];
  var VOICES = ["رجالي", "نسائي", "ثنائي", "كورال"];
  var VOICE_EN = { "رجالي": "male", "نسائي": "female", "ثنائي": "male and female duet", "كورال": "choir" };
  var GENRE_EN = { "بوب": "pop", "طرب كلاسيكي": "classical Arabic tarab", "راب": "rap", "هادئ": "calm acoustic", "شعبي ودبكة": "folk dabke", "روك": "rock", "إلكتروني": "electronic" };
  var state = { lang: "ar", genre: "بوب", mood: "حنين" };
  var $ = function (s) { return document.querySelector(s); };

  function h(tag, attrs) {
    var el = document.createElement(tag);
    for (var k in (attrs || {})) {
      if (k === "text") el.textContent = attrs[k];
      else if (k === "class") el.className = attrs[k];
      else if (k.indexOf("on") === 0) el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k]);
    }
    for (var i = 2; i < arguments.length; i++) { var c = arguments[i]; if (c != null) el.append(c.nodeType ? c : document.createTextNode(String(c))); }
    return el;
  }
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function chipGroup(id, items, key, objs) {
    var box = $(id);
    items.forEach(function (it) {
      var val = objs ? it.id : it, label = objs ? it.label : it;
      var b = h("button", { class: "chip", type: "button", text: label, "aria-pressed": String(state[key] === val) });
      b.addEventListener("click", function () {
        state[key] = val;
        box.querySelectorAll(".chip").forEach(function (c) { c.setAttribute("aria-pressed", String(c === b)); });
        if (key === "lang") $("#dialect-field").hidden = val !== "ar";
      });
      box.append(b);
    });
  }
  function fillSelect(id, items) { items.forEach(function (t) { $(id).append(h("option", { value: t, text: t })); }); }
  chipGroup("#g-lang", LANGS, "lang", true); chipGroup("#g-genre", GENRES, "genre"); chipGroup("#g-mood", MOODS, "mood");
  fillSelect("#dialect", DIALECTS); fillSelect("#maqam", MAQAMS); fillSelect("#voice", VOICES);

  /* Settings */
  $("#key").value = lsGet("ss.key", "");
  $("#singModel").value = lsGet("ss.singModel", "lyria-3.5");
  $("#textModel").value = lsGet("ss.textModel", "gemini-2.5-flash");
  if (!$("#key").value) $("#setup").open = true;
  $("#saveKey").addEventListener("click", function () {
    lsSet("ss.key", $("#key").value.trim()); lsSet("ss.singModel", $("#singModel").value); lsSet("ss.textModel", $("#textModel").value.trim());
    $("#setupStatus").textContent = "تم الحفظ.";
    if ($("#key").value.trim()) $("#setup").open = false;
  });

  function status(id, text, err) { var s = $(id); s.textContent = text; s.className = "status" + (err ? " err" : ""); }
  function needKey(id) {
    var k = lsGet("ss.key", "").trim();
    if (!k) { status(id, "أدخل مفتاح Gemini API في الإعدادات أولاً.", true); $("#setup").open = true; }
    return k;
  }
  async function callApi(url, body, key, signal) {
    var r = await fetch(url, { method: "POST", signal: signal, headers: { "Content-Type": "application/json", "x-goog-api-key": key }, body: JSON.stringify(body) });
    var data = null, raw = "";
    try { raw = await r.text(); data = JSON.parse(raw); } catch (e) {}
    if (!r.ok) {
      var msg = data && data.error && data.error.message ? data.error.message : ("HTTP " + r.status);
      var err = new Error(msg); err.http = r.status; throw err;
    }
    return data;
  }
  function describeError(e) {
    if (e && e.name === "AbortError") return "تم الإيقاف.";
    var m = (e && e.message) || "";
    if (e && (e.http === 400 || e.http === 403) && /API key|permission|PERMISSION|key/i.test(m)) return "المفتاح غير صحيح أو غير مسموح له بهذه الخدمة: " + m;
    if (e && e.http === 404) return "اسم النموذج غير موجود عند Google. غيّره في الإعدادات. الرسالة: " + m;
    if (e && e.http === 429) return "تجاوزت الحد المسموح. انتظر قليلاً أو راجع رصيد حسابك. " + m;
    if (e instanceof TypeError) return "فشل الاتصال بالإنترنت أو منعه المتصفح (CORS). " + m;
    return "حدث خطأ: " + m;
  }

  /* Step 2: write lyrics */
  function textPrompt() {
    var lang = LANGS.filter(function (x) { return x.id === state.lang; })[0];
    var maq = $("#maqam").value;
    return [
      "You are a songwriter and music arranger. Write an ORIGINAL song from the brief below.",
      "All lyrics must be in " + lang.prompt + (state.lang === "ar" ? ", dialect: " + $("#dialect").value : "") + ". Singable lines, natural rhyme, no copying of any existing song, no real artist names.",
      "Brief: " + $("#idea").value.trim(),
      "Genre: " + state.genre + ". Mood: " + state.mood + ". Voice: " + $("#voice").value + ".",
      maq === "اختر لي" ? "Choose a maqam or key that suits the genre and language." : "Maqam: " + maq + ".",
      "Structure: Intro, Verse 1, Chorus, Verse 2, Chorus, Bridge, Chorus, Outro. Each lyric section has 4 lines. Intro and Outro have an empty lyrics array.",
      "If the language is Kurdish, keep the vocabulary simple and set note to one short Arabic sentence asking a Kurdish speaker to review the spelling. Otherwise note is an empty string.",
      "Reply with only one JSON object: {\"title\": string, \"music_prompt\": string (English, max 300 characters: genre, tempo in BPM, maqam or key, instruments, mood, vocalist type; no artist names), \"sections\": [{\"tag\": string (one of Intro, Verse 1, Chorus, Verse 2, Bridge, Outro), \"lyrics\": [string]}], \"note\": string}"
    ].join("\n");
  }
  function parseJson(t) {
    t = String(t || "").trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
    try { return JSON.parse(t); } catch (e) {}
    var a = t.indexOf("{"), b = t.lastIndexOf("}");
    if (a >= 0 && b > a) return JSON.parse(t.slice(a, b + 1));
    throw new Error("الرد ليس بصيغة صحيحة. أعد المحاولة.");
  }
  var wctl = null;
  $("#write").addEventListener("click", async function () {
    var key = needKey("#writeStatus"); if (!key) return;
    if (!$("#idea").value.trim()) { status("#writeStatus", "اكتب الفكرة أولاً.", true); return; }
    $("#write").disabled = true; status("#writeStatus", "أكتب الكلمات...");
    wctl = new AbortController();
    try {
      var model = lsGet("ss.textModel", "gemini-2.5-flash").trim() || "gemini-2.5-flash";
      var res = await callApi(API + "/models/" + encodeURIComponent(model) + ":generateContent",
        { contents: [{ parts: [{ text: textPrompt() }] }], generationConfig: { responseMimeType: "application/json" } }, key, wctl.signal);
      var txt = res && res.candidates && res.candidates[0] && res.candidates[0].content && res.candidates[0].content.parts
        ? res.candidates[0].content.parts.map(function (p) { return p.text || ""; }).join("") : "";
      var d = parseJson(txt);
      var secs = Array.isArray(d.sections) ? d.sections : [];
      if (!secs.length) throw new Error("لم تصل أي أقسام. أعد المحاولة.");
      $("#title").value = String(d.title || "أغنية بلا عنوان");
      $("#lyrics").value = secs.map(function (s) {
        var ls = Array.isArray(s.lyrics) ? s.lyrics.map(String) : [];
        return "[" + String(s.tag || "Verse") + "]" + (ls.length ? "\n" + ls.join("\n") : "");
      }).join("\n\n");
      $("#style").value = String(d.music_prompt || GENRE_EN[state.genre] + " song");
      var note = $("#songNote"); note.textContent = String(d.note || ""); note.hidden = !d.note;
      $("#lyricsCard").hidden = false;
      status("#writeStatus", "تمت كتابة الكلمات. راجعها ثم اضغط غنِّ.");
      $("#lyricsCard").scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (e) { status("#writeStatus", describeError(e), true); }
    finally { $("#write").disabled = false; }
  });

  /* Step 4: sing with Lyria */
  function b64ToBlob(b64, mime) {
    var bin = atob(b64), u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return new Blob([u8], { type: mime });
  }
  function findAudio(o, depth) {
    if (!o || typeof o !== "object" || depth > 8) return null;
    var data = typeof o.data === "string" ? o.data : null;
    var mime = o.mime_type || o.mimeType || "";
    if (data && data.length > 2000 && (o.type === "audio" || /audio/i.test(mime))) return { data: data, mime: mime };
    for (var k in o) { var r = findAudio(o[k], depth + 1); if (r) return r; }
    return null;
  }
  function collectText(o, out, depth) {
    if (!o || typeof o !== "object" || depth > 8) return out;
    if (o.type === "text" && typeof o.text === "string") out.push(o.text);
    for (var k in o) collectText(o[k], out, depth + 1);
    return out;
  }
  function singPrompt() {
    var lang = LANGS.filter(function (x) { return x.id === state.lang; })[0];
    var full = lsGet("ss.singModel", "lyria-3.5") === "lyria-3.5";
    return [
      full ? "Create a full-length song of about 2 minutes." : "Create a 30-second song clip.",
      "Style: " + $("#style").value.trim() + ".",
      "Vocalist: " + (VOICE_EN[$("#voice").value] || "male") + " singer, original voice, not imitating any real singer.",
      "The vocals are sung in " + lang.name + ".",
      "Sing exactly these lyrics, following the section tags:",
      "",
      $("#lyrics").value.trim()
    ].join("\n");
  }
  var sctl = null, timer = null;
  $("#stop").addEventListener("click", function () { if (sctl) sctl.abort(); });
  $("#sing").addEventListener("click", async function () {
    var key = needKey("#singStatus"); if (!key) return;
    if (!$("#lyrics").value.trim()) { status("#singStatus", "الكلمات فارغة.", true); return; }
    sctl = new AbortController();
    $("#sing").disabled = true; $("#stop").hidden = false;
    var t0 = Date.now();
    clearInterval(timer);
    timer = setInterval(function () { status("#singStatus", "الغناء قيد التسجيل... " + Math.round((Date.now() - t0) / 1000) + " ثانية. قد يستغرق دقائق."); }, 1000);
    status("#singStatus", "الغناء قيد التسجيل...");
    try {
      var model = lsGet("ss.singModel", "lyria-3.5");
      var res = await callApi(API + "/interactions", { model: model, input: singPrompt() }, key, sctl.signal);
      var a = findAudio(res, 0);
      if (!a) {
        var t = collectText(res, [], 0).join(" ").slice(0, 300);
        throw new Error("لم يصل صوت. ربما رُفض الطلب بسبب الأمان أو لأن الكلمات تطابق أغنية معروفة. " + (t ? "رد النموذج: " + t : ""));
      }
      var mime = /^audio\//.test(a.mime) ? a.mime : (a.data.slice(0, 5) === "UklGR" ? "audio/wav" : "audio/mpeg");
      var blob = b64ToBlob(a.data, mime);
      showTake(blob, $("#title").value.trim() || "أغنية");
      await save({ id: String(Date.now()), title: $("#title").value.trim() || "أغنية", lyrics: $("#lyrics").value, style: $("#style").value, created: Date.now(), blob: blob });
      status("#singStatus", "جاهزة. حُفظت الأغنية في مكتبتك على هذا الجهاز.");
    } catch (e) { status("#singStatus", describeError(e), true); }
    finally { clearInterval(timer); $("#sing").disabled = false; $("#stop").hidden = true; }
  });

  function extOf(blob) { return /wav/.test(blob.type) ? "wav" : "mp3"; }
  function playerFor(blob, title) {
    var url = URL.createObjectURL(blob);
    var name = title.replace(/[\\/:*?"<>|]+/g, " ").trim() || "song";
    return [
      h("audio", { controls: "", src: url }),
      h("div", { class: "actions" }, h("a", { class: "btn", href: url, download: name + "." + extOf(blob), text: "تنزيل الملف الصوتي" }))
    ];
  }
  function showTake(blob, title) {
    var box = $("#take"); box.textContent = "";
    box.append(h("h3", { text: title }));
    playerFor(blob, title).forEach(function (n) { box.append(n); });
    box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  /* Library (IndexedDB, this device only) */
  function idb() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open("songstudio", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("songs", { keyPath: "id" }); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function tx(mode, fn) {
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        var q = fn(db.transaction("songs", mode).objectStore("songs"));
        q.onsuccess = function () { res(q.result); };
        q.onerror = function () { rej(q.error); };
      });
    });
  }
  function save(song) { return tx("readwrite", function (s) { return s.put(song); }).then(renderLib).catch(function () {}); }
  function renderLib() {
    return tx("readonly", function (s) { return s.getAll(); }).then(function (list) {
      list.sort(function (a, b) { return b.created - a.created; });
      var box = $("#lib"); box.textContent = "";
      $("#libCard").hidden = !list.length;
      list.forEach(function (it) {
        var load = h("button", { class: "btn small", type: "button", text: "فتح الكلمات" });
        load.addEventListener("click", function () {
          $("#title").value = it.title; $("#lyrics").value = it.lyrics; $("#style").value = it.style;
          $("#lyricsCard").hidden = false; $("#lyricsCard").scrollIntoView({ behavior: "smooth" });
        });
        var del = h("button", { class: "btn small", type: "button", text: "حذف" });
        del.addEventListener("click", function () { tx("readwrite", function (s) { return s.delete(it.id); }).then(renderLib).catch(function () {}); });
        var item = h("div", { class: "lib-item" }, h("b", { text: it.title }));
        playerFor(it.blob, it.title).forEach(function (n) { item.append(n); });
        item.append(h("div", { class: "actions" }, load, del));
        box.append(item);
      });
    }).catch(function () {});
  }
  renderLib();
})();
</script>
</body>
</html>
